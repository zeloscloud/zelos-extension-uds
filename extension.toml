name = "UDS"
version = "0.3.0"
description = "Diagnose ECUs over UDS (ISO 14229) on CAN, CAN-FD (ISO-TP) or DoIP: sessions, DIDs, routines, DTCs, security access, memory read/write and firmware flash. SocketCAN, PCAN, Kvaser, Vector, slcan; demo ECU included."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-uds"
# The marketplace search and Zelos AI find an extension by these words, its name and its description.
keywords = ["uds", "automotive", "diagnostics", "can", "iso-tp", "doip", "iso 14229", "isotp", "iso 15765", "iso 13400", "ecu", "dtc", "did", "read dtc", "clear dtc", "seed key", "reflash", "firmware update", "tester present", "nrc"]
categories = ["Automotive", "Diagnostics", "Embedded"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["main.py", "zelos_extension_uds"]
