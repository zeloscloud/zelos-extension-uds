repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        exclude: ^web/
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Agent runtime: ruff runs from the project's environment, at the version uv.lock locks.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # Web project: Prettier and ESLint run from web/node_modules, at the versions web/package-lock.json locks.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: web/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^web/
        types: [text]
      - id: eslint
        name: eslint
        entry: web/node_modules/.bin/eslint --fix
        language: system
        files: ^web/src/.*\.(ts|tsx)$
