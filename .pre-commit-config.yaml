repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        exclude: ^web/
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Agent runtime: ruff runs on Python files only.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.10"
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Web project: Prettier and ESLint run from web/node_modules, at the versions package.json locks.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: web/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^web/
        types: [text]
      - id: eslint
        name: eslint
        entry: web/node_modules/.bin/eslint --fix
        language: system
        files: ^web/src/.*\.(ts|tsx)$
