name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Agent runtime: uv installs the Python version pinned in .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        if: hashFiles('pyproject.toml') != ''
        with:
          enable-cache: true

      # Web project (tab and panels)
      - uses: actions/setup-node@v7
        if: hashFiles('web/package.json') != ''
        with:
          node-version-file: web/.nvmrc

      - uses: extractions/setup-just@v4

      - name: Install Zelos CLI
        run: |
          curl -fsSL https://release.zeloscloud.io/cli/install.sh | bash
          echo "$HOME/.zelos/bin" >> "$GITHUB_PATH"
        env:
          INSTALLER_NO_MODIFY_PATH: 1

      - name: Install dependencies
        run: just ci-install

      - name: Check formatting and lint, and type-check the web project
        run: just check

      - name: Run tests
        run: just test

      - name: Build and package extension
        run: just package
